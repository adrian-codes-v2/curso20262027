name: Completar RAM de UT2
on:
  push:
    paths:
      - '.github/workflows/ordenar-fotos-ut2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Completar datos de RAM
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('UT2/montaje.md')
          t = p.read_text()
          t = t.replace('| RAM | Crucial (módulo DIMM) | Capacidad no legible en las fotos: no identificado |', '| RAM | Crucial (modelo no identificado) | 2 GB, DDR3, 1333 MHz, formato DIMM |')
          t = t.replace('La capacidad de la RAM y la marca de la fuente no se leen en las fotos, por eso figuran como «no identificado».', 'Los datos de la RAM se completaron con la ficha de taller: Crucial, 2 GB, DDR3 a 1333 MHz y formato DIMM. La marca de la fuente no se lee en las fotos, por eso figura como «no identificado».')
          p.write_text(t)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add UT2/montaje.md
          if ! git diff --cached --quiet; then
            git commit -m 'Completar datos de la RAM en la ficha de montaje'
            git push
          fi
